<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品到期提醒系统</title>
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <!-- 资源地址带版本号：静态托管的 Cache-Control 是 max-age=31536000（一年），
         CDN 和浏览器都会长期留着老副本，改了代码不加版本号就还是跑旧的。
         每次改完 css / js，把下面的 v 值换一下（例如换成当天日期）再部署 -->
    <link rel="stylesheet" href="styles.css?v=20260913c">
    <!-- 扫码库放在本地，避免国内访问 CDN 不稳定甚至加载不出来。
         图表已改成一行统计标签，不再需要 Chart.js（顺带省下 205KB） -->
    <script src="html5-qrcode.min.js?v=20260913c"></script>
    <!-- CloudBase SDK 体积较大且只在腾讯云模式用到，改为需要时再动态加载（见 script.js） -->
</head>
<body>
    <div class="container">
        <header>
            <h1>商品到期提醒系统</h1>
        </header>

        <main>
            <!-- 到期提醒横幅（有临期 / 过期商品时由 script.js 显示出来） -->
            <section id="reminderBanner" class="reminder-banner" style="display: none;"></section>

            <!-- 数据概览：一行小标签，替代原来那张 300~400px 高的柱状图 -->
            <div id="statsStrip" class="stats-strip"></div>

            <!-- 商品列表：每次打开页面主要就是看它，所以放在最前面 -->
            <section class="list-section">
                <h2>商品列表</h2>

                <!-- 视图控制：以前和「清空 / 同步 / 获取」挤在一排，手机上 5 个按钮各占一行，
                         把列表顶到了第二屏。它们本质是列表的显示方式，跟着列表走更合理 -->
                <div class="list-view-controls">
                    <button id="filterBtn" class="btn btn-warning">筛选1个月内到期商品</button>
                    <button id="handledFilterBtn" class="btn btn-secondary">显示已处理</button>
                </div>

                <!-- 搜索：输入即筛选，所以不需要「搜索」按钮，输入框和「清空」收成一行 -->
                <div class="search-controls">
                    <input type="text" id="productSearch" placeholder="搜索名称或条码">
                    <button id="productClearSearchBtn" class="btn btn-secondary">清空</button>
                </div>

                <div class="scrollable-content">
                    <table id="productTable">
                        <thead>
                            <tr>
                                <!-- 操作放在最左边：手机上打开列表第一眼就能点到按钮，不用横向滑到最右。
                                     改这里的顺序时，script.js 里 renderProducts 的单元格顺序要一起改 -->
                                <th>操作</th>
                                <th>序号</th>
                                <th>有效期</th>
                                <th>状态</th>
                                <th>名称</th>
                                <th>类型</th>
                                <th>扫描日期</th>
                                <th>生产日期</th>
                                <th>保质期</th>
                                <th>条码</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 商品数据将通过JavaScript动态添加 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 添加商品：默认收起成一行标题栏，点开才展开表单。
                 添加是低频动作，常驻的表单在手机上要占掉近一整屏，
                 而每次打开页面真正想看的是上面的商品列表 -->
            <section class="form-section collapsed" id="addSection">
                <button type="button" id="addToggleBtn" class="section-toggle"
                        aria-expanded="false" aria-controls="productForm">
                    <span>添加商品</span>
                    <span class="toggle-mark" aria-hidden="true">▾</span>
                </button>
                <form id="productForm" hidden>
                    <div class="form-group">
                        <label for="barcode">商品条码:</label>
                        <div class="barcode-input-wrapper">
                            <input type="text" id="barcode" name="barcode" placeholder="扫描或输入条码" required>
                            <button type="button" id="scanBtn" class="btn-scan" title="摄像头扫码">📷</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="productName">商品名称:</label>
                        <input type="text" id="productName" name="productName" placeholder="自动带出或手动输入" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productionDate">生产日期:</label>
                            <input type="date" id="productionDate" name="productionDate">
                        </div>
                        <div class="form-group">
                            <label for="shelfLife">保质期:</label>
                            <div class="shelf-life-wrapper">
                                <input type="number" id="shelfLife" name="shelfLife" min="1" placeholder="数量">
                                <select id="shelfLifeUnit" name="shelfLifeUnit">
                                    <option value="天">天</option>
                                    <option value="月" selected>个月</option>
                                    <option value="年">年</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="validity">有效期:</label>
                            <input type="date" id="validity" name="validity" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">添加商品</button>
                    <!-- 只有从列表里点过「编辑」才显示（见 script.js 的 setEditMode），
                         否则点完编辑表单被填上，想放弃就只能手动清空 -->
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary"
                            style="display: none;" onclick="cancelEdit()">取消编辑</button>
                </form>
            </section>

            <!-- 商品条码映射管理 -->
            <section class="mapping-section">
                <h2>条码-名称映射管理</h2>
                <!-- 和商品列表一样：输入即筛选，输入框和「清空」占一行 -->
                <div class="search-controls">
                    <input type="text" id="mappingSearch" placeholder="搜索名称或条码">
                    <button id="mappingClearSearchBtn" class="btn btn-secondary">清空</button>
                </div>
                <div class="mapping-controls">
                    <input type="text" id="newBarcode" placeholder="新条码">
                    <input type="text" id="newProductName" placeholder="商品名称">
                    <button id="addMappingBtn" class="btn btn-primary">添加映射</button>
                </div>
                <div class="scrollable-content">
                    <table id="mappingTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>条码</th>
                                <th>商品名称</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 映射数据将通过JavaScript动态添加 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 数据区：同步 / 获取 / 导入导出 / 清空，都是「整份数据」层面的操作，集中放最下面。
                 「清空」是破坏性操作，离列表远一点，免得手滑误触 -->
            <section class="controls data-controls">
                <button id="syncBtn" class="btn btn-info">同步数据</button>
                <button id="fetchBtn" class="btn btn-success">获取最新数据</button>
                <button id="exportBtn" class="btn btn-secondary">导出CSV</button>
                <input type="file" id="importFile" accept=".csv" style="display: none;">
                <button id="importBtn" class="btn btn-secondary">导入CSV</button>
                <button id="clearBtn" class="btn btn-danger">清空所有数据</button>
            </section>
        </main>
    </div>

    <!-- 处置弹窗：标记为已处理，商品记录本身不删除 -->
    <div id="handleModal" class="scanner-modal" style="display: none;">
        <div class="handle-dialog">
            <h3>标记已处理</h3>
            <p id="handleProductName" class="handle-product"></p>
            <div class="form-group">
                <label for="handleAction">处置方式:</label>
                <select id="handleAction">
                    <option value="已用完">已用完</option>
                    <option value="已丢弃">已丢弃</option>
                    <option value="已退换">已退换</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="handleNote">备注（可不填）:</label>
                <input type="text" id="handleNote" placeholder="例如：长毛了整箱扔 / 已退回超市">
            </div>
            <div class="scanner-actions">
                <button type="button" id="handleConfirmBtn" class="btn btn-primary">确认处理</button>
                <button type="button" id="handleCancelBtn" class="btn btn-secondary">取消</button>
            </div>
            <p class="handle-hint">标记后商品不会删除，条码 / 生产日期 / 有效期都会保留，只是从待处理列表里隐藏，随时可以撤销。</p>
        </div>
    </div>

    <!-- 摄像头扫码弹窗 -->
    <div id="scannerModal" class="scanner-modal" style="display: none;">
        <div class="scanner-content">
            <h3>扫描商品条码</h3>
            <div id="reader"></div>
            <p class="scanner-hint">把条码横着放进亮框，镜头离条码 10~15 厘米最清楚（贴太近反而对不上焦）<br>对不准时，点一下画面或按「重新对焦」</p>
            <div class="scanner-actions">
                <button type="button" id="refocusBtn" class="btn btn-secondary" style="display: none;">重新对焦</button>
                <button type="button" id="torchBtn" class="btn btn-info" style="display: none;">开灯</button>
                <button type="button" id="stopScanBtn" class="btn btn-danger">取消扫描</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=20260913c"></script>
</body>
</html>
